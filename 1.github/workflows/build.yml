name: Build Magmacraft 1.20.1 JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.1.1 einrichten (kein lokaler Wrapper nötig)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Magmacraft Mod kompilieren
        run: gradle build --no-daemon

      - name: Fertige Mod-JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Magmacraft-1.20.1-Forge-JAR
          path: build/libs/*.jar
